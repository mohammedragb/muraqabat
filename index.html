function generateNextWeek(){state.weekOffset=weekOffsetOf(new Date())+1;state.mode='all';const n=document.getElementById('notice');n.textContent="✅ تم توليد جداول الأسبوع القادم (الأحد → الخميس).";n.classList.add('show');render();window.scrollTo({top:0,behavior:'smooth'});}
function resetEdits(){openDlg("حذف تعديلات هذا الأسبوع؟","",false,()=>{Object.keys(edits).forEach(k=>{if(k.startsWith(state.weekOffset+"|"))delete edits[k];});store.set('edits_v7',edits);render();});}
const opts=(sel,dayKey,pKey)=>{const list=teachers.filter(n=>isAllowedTeacher(n,dayKey,pKey)||n===sel);let o=list.map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('');if(sel&&!list.includes(sel))o=`<option selected>${sel}</option>`+o;return o;};
const optsAll=(sel)=>{let o=teachers.map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('');if(sel&&!teachers.includes(sel))o=`<option selected>${sel}</option>`+o;return o;};
function tableHTML(pKey,dayKey,w){const rows=rotate(pKey,dayKey,w);return `<table class="t"><thead><tr><th class="n">#</th><th class="lo">مكان المراقبة</th><th class="na">اسم المعلم</th><th class="si">التوقيع</th></tr></thead><tbody>`+rows.map((r,i)=>{const k=`${w}|${dayKey}|${pKey}|${i}`;const name=edits[k]||ONEOFF[k]||r.name;return `<tr><td class="n">${i+1}</td><td class="lo">${r.loc}</td><td class="na"><select class="nm ${r.fixed?'fx':''} ${edits[k]||ONEOFF[k]?'ed':''}" data-k="${k}">${opts(name,dayKey,pKey)}</select></td><td class="si"></td></tr>`;}).join('')+`</tbody></table>`;}
function card(pKey,dayKey,w,s){const p=PERIODS[pKey];return `<div class="card"><div class="ph"><span>${p.title}</span><span class="badge">${p.time}</span></div>${tableHTML(pKey,dayKey,w)}${s}</div>`;}
function supSel(w,dk){const k=`${w}|${dk}|sup`;return `<select class="nm ${edits[k]?'ed':''}" data-k="${k}">${optsAll(edits[k]||baseFor(w,dk)[dk].sup)}</select>`;}
function pageHTML(w,d){const day=DAYS[d],dk=day.key,date=fmt(addDays(weekStart(w),d)),S=supSel(w,dk);return `<div class="a4"><div class="hdr"><div class="r"><b>مملكة البحرين</b><br>وزارة التربية والتعليم<br>مدرسة البسيتين الإعدادية للبنين</div><div class="c"><img src="${currentLogo()}" alt="شعار مملكة البحرين" onerror="this.onerror=null;this.src='${LOGO_ALT}'"><small>KINGDOM OF BAHRAIN · MINISTRY OF EDUCATION<br>Busaiteen Intermediate Boys School</small></div><div class="l">العام الدراسي<br><b>2026-2027م</b><br>الفصل الدراسي الأول</div></div><div class="title" contenteditable="true">جدول مراقبة ليوم ${day.ar} ${date}م</div><div class="grid"><div class="col r">${card('morning',dk,w,`<div class="sup">رئيس فريق الاستقبال الصباحي: المدير المساعد أ: أحمد يوسف صلاح الدين</div><div class="sup g">مشرف فريق الاستقبال الصباحي: ${S}</div>`)}${card('recess1',dk,w,`<div class="sup g">مشرف مراقبة الفسحة الأولى: ${S}</div>`)}${card('recess2',dk,w,`<div class="sup g">مشرف مراقبة الفسحة الثانية: ${S}</div>`)}</div><div class="col">${card('dismissal6',dk,w,`<div class="sup">رئيس فريق الانصراف: المدير المساعد أ: أحمد يوسف صلاح الدين</div><div class="sup g">مشرف فريق الانصراف: ${S}</div>`)}${card('dismissalPrep',dk,w,`<div class="sup g">مشرف فريق الانصراف: ${S}</div><div class="sup">رئيس فريق الانصراف: اسامه السيد علي موسى</div>`)}<div class="notes"><div class="tt">ملاحظات</div><ul><li>يتولى الأساتذة الكرام الإشراف على الدرج خلال الفسحة الأولى على النحو الآتي:<ul class="st"><li>– درج المصادر: الأستاذ عبدالرحمن البنكي</li><li>– درج ثالث إعدادي: الأستاذ محمد الخطيب</li><li>– درج أول إعدادي: الأستاذ علي محمد بدر</li></ul></li><li>على مشرفي الفرق متابعة الدرج والممرات الخاصة بهم.</li><li>يُرجى من السادة المراقبين عدم مغادرة موقع المراقبة إلا بعد سماع الجرس الثاني.</li><li>يلتزم مراقبو الفترة الصباحية بالبقاء في موقع المراقبة حتى الساعة السابعة صباحاً.</li><li>يُرجى صرف الطلاب من الساحات والممرات إلى صفوفهم.</li><li>شاكرين لكم حسن تعاونكم وحرصكم الدائم، وجزاكم الله خيراً.</li></ul></div></div></div><div class="quote"><span class="tag">✦ ${titleWord} ✦</span> » ${quoteFor(w,d)} «</div><div class="sigs"><div>اسامه السيد علي موسى<span>المدير المساعد _ مسئول المراقبات</span></div><div>يونس علي احمد<span>مدير المدرسة</span></div></div></div>`;}
function render(){const w=state.weekOffset,ws=weekStart(w);document.getElementById('pages').innerHTML=state.mode==='all'?DAYS.map((_,i)=>pageHTML(w,i)).join(''):pageHTML(w,state.dayIndex);document.getElementById('weekInfo').textContent=`الأسبوع: الأحد ${fmt(ws)} → الخميس ${fmt(addDays(ws,4))} | دورة ${w+1}`;document.getElementById('datePicker').value=fmt(addDays(ws,state.dayIndex));document.querySelectorAll('#dayButtons .btn').forEach((b,i)=>b.classList.toggle('active',state.mode==='day'&&i===state.dayIndex));document.getElementById('allBtn').classList.toggle('active',state.mode==='all');const lp=document.getElementById('logoPrev');lp.src=currentLogo();lp.onerror=()=>{lp.onerror=null;lp.src=LOGO_ALT;};if(document.getElementById('rotBox').classList.contains('show'))buildRot();buildQuotas();}
document.addEventListener('change',e=>{if(e.target.matches('select.nm')){edits[e.target.dataset.k]=e.target.value;store.set('edits_v7',edits);e.target.classList.add('ed');buildQuotas();}});
function toggleRot(){const b=document.getElementById('rotBox');b.classList.toggle('show');if(b.classList.contains('show'))buildRot();}
function buildRot(){const dk=DAYS[state.dayIndex].key,w=state.weekOffset;let h=`<h3>معاينة التدوير – يوم ${DAYS[state.dayIndex].ar}</h3>`;for(const pKey in PERIODS){const weeks=[0,1,2,3];h+=`<b style="color:#b45309">${PERIODS[pKey].title}</b><table><tr><th>المكان</th>${weeks.map(k=>`<th>${fmt(weekStart(w+k))}</th>`).join('')}</tr>`;const cols=weeks.map(k=>rotate(pKey,dk,w+k));cols[0].forEach((r,i)=>{h+=`<tr><td><b>${r.loc}</b></td>${weeks.map(k=>`<td class="${k===0?'cur':''}">${cols[k][i]?cols[k][i].name:''}</td>`).join('')}</tr>`;});h+=`</table>`;}document.getElementById('rotBox').innerHTML=h;}
function uploadLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{store.set('logo_v6',e.target.result);render();};r.readAsDataURL(f);}
function resetLogo(){store.del('logo_v6');render();}
let _dlgCb=null;function openDlg(msg,val,hasInp,cb){document.getElementById("dlgMsg").textContent=msg;const inp=document.getElementById("dlgInp");inp.style.display=hasInp?"block":"none";inp.value=val||"";_dlgCb=cb;document.getElementById("dlg").style.display="flex";if(hasInp)inp.focus();}function closeDlg(){document.getElementById("dlg").style.display="none";_dlgCb=null;}document.getElementById("dlgOk").onclick=()=>{const v=document.getElementById("dlgInp").value;const cb=_dlgCb;closeDlg();if(cb)cb(v);};
function openQuotes(){document.getElementById('quotesArea').value=quotes.join('\n');document.getElementById('modal').classList.add('show');}
function closeQuotes(){document.getElementById('modal').classList.remove('show');}
function saveQuotes(){const arr=document.getElementById('quotesArea').value.split('\n').map(s=>s.trim()).filter(Boolean);if(arr.length){quotes=arr;store.set('quotes_v6',quotes);}closeQuotes();render();}
function changeTitleWord(){openDlg("العنوان البديل لـ (كلمة اليوم للمعلمين):",titleWord,true,nw=>{if(nw&&nw.trim()){titleWord=nw.trim();store.set('titleWord_v6',titleWord);render();}});}
function fitPrint(){const avail=(291-1.5)*96/25.4;document.querySelectorAll('.a4').forEach(p=>{p.style.zoom='';p.style.width='204mm';p.style.minHeight='0';p.style.height='auto';p.style.padding='2mm 3mm';const h=p.scrollHeight;p.style.minHeight='';p.style.height='';p.style.zoom=h>avail?(avail/h).toFixed(4):'';});}
function unfitPrint(){document.querySelectorAll('.a4').forEach(p=>{p.style.zoom='';p.style.width='';p.style.minHeight='';p.style.height='';p.style.padding='';});}
window.addEventListener('beforeprint',fitPrint);window.addEventListener('afterprint',unfitPrint);
function printPages(){
  let printed=false;
  const onAfter=()=>{printed=true;window.removeEventListener('afterprint',onAfter);};
  window.addEventListener('afterprint',onAfter);
  try{fitPrint();window.print();}catch(e){}
  setTimeout(()=>{
    unfitPrint();
    if(!printed && window.self!==window.top){
      openDlg("نافذة المعاينة تمنع أمر الطباعة المباشر من المتصفح. يمكنك تنزيل الملف من المحادثة (أو زر التنزيل أعلى المعاينة) وفتحه في المتصفح ثم الضغط على (طباعة / PDF).", "", false, null);
    }
  },400);
}
function downloadHTML(){
  const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='جدول_المراقبة_الأسبوعي.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function buildQuotas(){
  const w=state.weekOffset,ws=weekStart(w);
  const pKeys=['morning','recess1','recess2','dismissal6','dismissalPrep'];
  const counts={};
  teachers.forEach(t=>{counts[t]={morning:0,recess1:0,recess2:0,dismissal6:0,dismissalPrep:0};});
  DAYS.forEach(d=>{
    pKeys.forEach(pKey=>{
      const rows=rotate(pKey,d.key,w);
      rows.forEach((r,i)=>{
        const k=`${w}|${d.key}|${pKey}|${i}`;
        const name=edits[k]||ONEOFF[k]||r.name;
        if(!name)return;
        if(!counts[name])counts[name]={morning:0,recess1:0,recess2:0,dismissal6:0,dismissalPrep:0};
        counts[name][pKey]++;
      });
    });
  });
  const list=Object.keys(counts).sort((a,b)=>{
    const ia=teachers.indexOf(a),ib=teachers.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1;
    if(ib!==-1)return 1;
    return a.localeCompare(b,'ar');
  });
  const totals={morning:0,recess1:0,recess2:0,dismissal6:0,dismissalPrep:0,all:0};
  const bodyRows=list.map((name,idx)=>{
    const c=counts[name];
    const sum=c.morning+c.recess1+c.recess2+c.dismissal6+c.dismissalPrep;
    pKeys.forEach(pk=>{totals[pk]+=c[pk];});
    totals.all+=sum;
    const cell=v=>`<td class="${v===0?'q-zero':''}">${v}</td>`;
    return `<tr><td class="q-idx">${idx+1}</td><td class="q-name">${name}</td>${cell(c.morning)}${cell(c.recess1)}${cell(c.recess2)}${cell(c.dismissal6)}${cell(c.dismissalPrep)}<td class="q-tot">${sum}</td></tr>`;
  }).join('');
  document.getElementById('quotaBox').innerHTML=`
    <div class="q-hdr">
      <div class="grp">
        <h3>جدول أنصبة مراقبات المعلمين</h3>
        <span class="q-sub">الأسبوع: الأحد ${fmt(ws)} → الخميس ${fmt(addDays(ws,4))} | دورة ${w+1}</span>
      </div>
      <button class="btn green q-print-btn" onclick="printQuotas()">🖨️ طباعة جدول الأنصبة</button>
    </div>
    <div class="q-wrap">
      <table class="qt">
        <thead>
          <tr>
            <th>#</th>
            <th class="q-name">اسم المعلم</th>
            <th>الصباحي</th>
            <th>ف 1</th>
            <th>ف 2</th>
            <th>انصراف سادس</th>
            <th>انصراف إعدادي</th>
            <th>المجموع</th>
          </tr>
        </thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>
          <tr>
            <td colspan="2" style="text-align:right;padding-right:10px">الإجمالي (${list.length} معلم)</td>
            <td>${totals.morning}</td>
            <td>${totals.recess1}</td>
            <td>${totals.recess2}</td>
            <td>${totals.dismissal6}</td>
            <td>${totals.dismissalPrep}</td>
            <td>${totals.all}</td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}
function printQuotas(){
  document.body.classList.add('print-quotas');
  const cleanup=()=>document.body.classList.remove('print-quotas');
  window.addEventListener('afterprint',cleanup,{once:true});
  try{window.print();}catch(e){}
  setTimeout(cleanup,600);
}
window.onload=()=>{document.getElementById('dayButtons').innerHTML=DAYS.map((d,i)=>`<button class="btn" onclick="loadDay(${i})">${d.ar}</button>`).join('');goToToday();};
</script>
